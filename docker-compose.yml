services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spendlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-spendlens}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spendlens} -d ${POSTGRES_DB:-spendlens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Bound to loopback only — reachable for local psql/drizzle-kit studio,
    # never from outside the host. The `web` container reaches it over the
    # internal compose network regardless of this mapping.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      DATABASE_URL: postgres://${POSTGRES_USER:-spendlens}:${POSTGRES_PASSWORD:-spendlens}@db:5432/${POSTGRES_DB:-spendlens}
      RUN_MIGRATIONS_ON_BOOT: "true"
      ARC_NETWORK: ${ARC_NETWORK:-testnet}
      ARC_MAINNET_RPC_URL: ${ARC_MAINNET_RPC_URL:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-Spendlens <no-reply@localhost>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-}
      # Background jobs (Arc reconciliation, ledger digests) — see lib/jobs.ts
      RECONCILE_INTERVAL_MINUTES: ${RECONCILE_INTERVAL_MINUTES:-10}
      RECONCILE_GRACE_SECONDS: ${RECONCILE_GRACE_SECONDS:-300}
      RECONCILE_AUTO_HALT: ${RECONCILE_AUTO_HALT:-true}
      DIGEST_INTERVAL_MINUTES: ${DIGEST_INTERVAL_MINUTES:-60}
      ANCHOR_PRIVATE_KEY: ${ANCHOR_PRIVATE_KEY:-}
      CRON_SECRET: ${CRON_SECRET:-}
      # Alerts / observability
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
    # No host port published — reachable only from other containers on the
    # compose network (i.e. caddy). Use docker-compose.override.yml to add
    # a `ports: ["3000:3000"]` mapping for local dev without a proxy in front.
    healthcheck:
      # Node is in the runner image; curl/wget are not.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Nightly logical backups of the database into the `db-backups` volume,
  # keeping BACKUP_KEEP_DAYS (default 14). Restore:
  #   docker compose exec -T db psql -U spendlens spendlens < backup.sql
  # (see DEPLOY.md). Copy the volume off-host too — a backup on the same disk
  # as the database is not a backup.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-spendlens}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-spendlens}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - db-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/spendlens-$$(date -u +%Y%m%dT%H%M%SZ).sql.gz
          if pg_dump --no-owner | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok: $$f";
          else rm -f "$$f.tmp"; echo "backup FAILED" >&2; fi
          find /backups -name 'spendlens-*.sql.gz' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $${BACKUP_INTERVAL_SECONDS}
        done

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      # Reverse-proxy target + auto-HTTPS domain (or ":80" to serve plain
      # HTTP on an IP with no domain — Caddy can't get a cert for a bare IP).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  db-backups:
  caddy-data:
  caddy-config:
