# Spendlens policy file — a sample policy for research-crawler-01.
# The allowlist's second entry (0x1a2b…ef12) is an address that's actually
# "allow"-ed in this repo's own mock dataset — a different address is used
# in the dashboard's demo data as the deliberately BLOCKED one.
version: 1
agent: research-crawler-01

budgets:
  - scope: task
    limit_usdc: 5.00
  - scope: hour
    limit_usdc: 2.00
  - scope: day
    limit_usdc: 20.00
  - scope: month
    limit_usdc: 400.00

per_call:
  max_usdc: 0.05
  max_calls_per_minute: 600

counterparties:
  mode: allowlist
  allow:
    - "api.example.io"
    - "0x1a2b3c4d5e6f7890abcdef1234567890abcdef12"
  deny: []
  first_seen:
    action: hold
    auto_allow_below_usdc: 0.001

anomaly:
  burn_rate:
    baseline: ewma
    halflife_minutes: 15
    z_threshold: 3.0
    action: hold
  new_counterparty_rate:
    max_per_hour: 5
    action: alert
  # Sudden concentration of calls onto one counterparty (entropy of the
  # counterparty mix over the window drops by more than max_drop).
  counterparty_entropy:
    window_minutes: 60
    min_calls: 50
    max_drop: 0.6
    action: alert

quality:
  failure_status_codes: [402, 429, 500, 502, 503, 504]
  empty_body_is_failure: true
  # Inline JSON Schema the response body must satisfy, else quality =
  # schema_fail (paid for, but not what was ordered).
  json_schema:
    type: object
    required: [data]
  max_latency_ms: 4000

escalation:
  webhook: "https://ops.example.io/hooks/spendlens"
  timeout_seconds: 30
  on_timeout: block
  # Ceiling for Spendlens's own /api/escalate to auto-approve a hold.
  # Separate from counterparties.first_seen.auto_allow_below_usdc on
  # purpose — a first_seen hold only fires *above* that number, so reusing
  # it here would make every first_seen hold unapprovable. Omit to default
  # to 5x the first_seen ceiling.
  auto_approve_below_usdc: 0.01
