<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" width="280" height="80">
  <g transform="translate(10, 10)">
    <!-- Spendlens Lens Mark (60x60) for Dark Mode -->
    <g transform="scale(0.6)">
      <circle cx="50" cy="50" r="36" fill="none" stroke="#f6f6f5" stroke-width="12" />
      <circle
        cx="50"
        cy="50"
        r="36"
        fill="none"
        stroke="#3bdf7a"
        stroke-width="12"
        stroke-linecap="round"
        stroke-dasharray="155.38 226.19"
        transform="rotate(-90 50 50)"
      />
      <circle cx="50" cy="50" r="7" fill="#f6f6f5" />
    </g>

    <!-- Wordmark: Light for dark backgrounds -->
    <text x="76" y="42" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" letter-spacing="-0.03em" fill="#f6f6f5">
      <tspan font-weight="600">spend</tspan><tspan font-weight="400">lens</tspan>
    </text>
  </g>
</svg>
